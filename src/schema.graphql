scalar Date
scalar DateTime

# Air raid alert state for an oblast, as reported by alerts.in.ua.
#
# UNKNOWN is a real answer, not a missing one: the feed is unreachable, the
# last reading has aged out, or no region has been chosen. It must never be
# rendered as "no alert" — saying "quiet" when we do not know is the one
# mistake this feature cannot afford.
enum AirRaidStatus {
    ACTIVE
    PARTLY
    NO_ALERT
    UNKNOWN
}

# One of the 27 oblast-level regions alerts.in.ua reports on.
type AlertRegion {
    # alerts.in.ua's stable location uid.
    uid: Int!
    title: String!
}

# Represents the GPS tracking device
type Tsutsyk {
    id: ID!
    name: String
    photoUrl: String
    claimed: Boolean!
    alertDistanceMeters: Int!
    # The oblast whose air raid alerts this tracker follows. Null until the
    # owner picks one, and while it is null the tracker keeps its everyday
    # reporting cadence — we would rather do nothing than guess a region and
    # follow another part of the country's alerts.
    alertRegion: AlertRegion
    # Live alert state for `alertRegion`, UNKNOWN when no region is set.
    airRaidStatus: AirRaidStatus!
    sessions: [Session!]!
}

# The subset of a Tsutsyk's details that are safe to show to an
# unauthenticated scanner of its public tsutsyk.live/tsutsyk/<id> page —
# no session/location history.
type TsutsykPublicProfile {
    id: ID!
    claimed: Boolean!
    name: String
    photoUrl: String
}

# Ensure your Location type is also defined
type Location {
    id: ID!
    latitude: Float!
    longitude: Float!
    timestamp: DateTime!
    sessionId: String!
    battery: Float
}

# Represents a specific trip or tracking period
type Session {
    id: String!
    tsutsykId: String!
    startTime: DateTime!
    endTime: DateTime
    locationCount: Int!
    status: SessionStatus!
    locations: [Location!]!
}

enum SessionStatus {
    ACTIVE
    COMPLETED
}

type Query {
    # Get all sessions for a device
    getTsutsykSessions(tsutsykId: String!): [Session!]!

    # Get specific session with all locations
    getSession(sessionId: String!): Session

    # Get active session for a device (if any)
    getActiveSession(tsutsykId: String!): Session
    # This name MUST match the string in your @Query() decorator
    getTsutsykHistory(sessionId: ID!): [Location!]!

    # Optional: add a query to get the tracker details
    getTsutsyk(id: ID!): Tsutsyk

    # Public, unauthenticated lookup used by the tsutsyk.live/tsutsyk/<id>
    # landing page — to decide whether to show the onboarding flow or the
    # public profile, and to render that profile. Never exposes sessions.
    getTsutsykPublicProfile(id: ID!): TsutsykPublicProfile

    # The Tsutsyks owned by the caller (requires auth).
    getMyTsutsyks: [Tsutsyk!]!

    # The regions a tracker can be pointed at, for the owner's picker.
    # Static, and ordered the way alerts.in.ua lists them.
    getAlertRegions: [AlertRegion!]!
}

type Mutation {
    # Auto-created when first location arrives, but you can call manually
    startSession(tsutsykId: String!, sessionId: String!): Session!
    # Mark session as completed
    endSession(sessionId: String!): Session!
    # While trackers use REST, you can use this for manual testing
    # or if the client needs to manually add a point.
    postLocation(
        tsutsykId: String!,
        sessionId: String!,
        lat: Float!,
        lng: Float!
        battery: Int
    ): Location!
    # Update the tracker's profile photo, how far it can wander before
    # alerting, and which oblast's air raid alerts it follows.
    # Requires auth; caller must own the Tsutsyk.
    # `alertRegionUid` must be one of `getAlertRegions`; pass null to clear it
    # and put the tracker back on its everyday cadence.
    updateTsutsyk(
        id: ID!,
        photoUrl: String,
        alertDistanceMeters: Int,
        alertRegionUid: Int
    ): Tsutsyk!

    # First-scan onboarding: claims an unclaimed Tsutsyk for the caller.
    # Requires auth. Fails if the Tsutsyk is already claimed by someone else.
    claimTsutsyk(
        id: ID!,
        name: String!,
        photoUrl: String
    ): Tsutsyk!
}

type Subscription {
    # The magic part: The client listens here for real-time updates
    # Filtered by sessionId so you don't receive everyone's coordinates
    locationUpdates(sessionId: ID!): Location!
}