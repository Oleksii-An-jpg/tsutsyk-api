scalar Date
scalar DateTime

# Represents the GPS tracking device
type Tsutsyk {
    id: ID!
    photoUrl: String
    alertDistanceMeters: Int!
    sessions: [Session!]!
}

# Ensure your Location type is also defined
type Location {
    id: ID!
    latitude: Float!
    longitude: Float!
    timestamp: DateTime!
    sessionId: String!
    battery: Float
}

# Represents a specific trip or tracking period
type Session {
    id: String!
    tsutsykId: String!
    startTime: DateTime!
    endTime: DateTime
    locationCount: Int!
    status: SessionStatus!
    locations: [Location!]!
}

enum SessionStatus {
    ACTIVE
    COMPLETED
}

type Query {
    # Get all sessions for a device
    getTsutsykSessions(tsutsykId: String!): [Session!]!

    # Get specific session with all locations
    getSession(sessionId: String!): Session

    # Get active session for a device (if any)
    getActiveSession(tsutsykId: String!): Session
    # This name MUST match the string in your @Query() decorator
    getTsutsykHistory(sessionId: ID!): [Location!]!

    # Optional: add a query to get the tracker details
    getTsutsyk(id: ID!): Tsutsyk
}

type Mutation {
    # Auto-created when first location arrives, but you can call manually
    startSession(tsutsykId: String!, sessionId: String!): Session!
    # Mark session as completed
    endSession(sessionId: String!): Session!
    # While trackers use REST, you can use this for manual testing
    # or if the client needs to manually add a point.
    postLocation(
        tsutsykId: String!,
        sessionId: String!,
        lat: Float!,
        lng: Float!
        battery: Int
    ): Location!
    # Update the tracker's profile photo and/or how far it can wander before alerting.
    updateTsutsyk(
        id: ID!,
        photoUrl: String,
        alertDistanceMeters: Int
    ): Tsutsyk!
}

type Subscription {
    # The magic part: The client listens here for real-time updates
    # Filtered by sessionId so you don't receive everyone's coordinates
    locationUpdates(sessionId: ID!): Location!
}