scalar Date
scalar DateTime

# Represents the GPS tracking device
type Tsutsyk {
    id: ID!
    sessions: [Session!]!
}

# Ensure your Location type is also defined
type Location {
    id: Int!
    latitude: Float!
    longitude: Float!
    timestamp: DateTime!
    sessionId: String!
    battery: Float
}

# Represents a specific trip or tracking period
type Session {
    id: ID!
    tsutsykId: String!
    tsutsyk: Tsutsyk!
    locations: [Location!]!
}

type Query {
    # This name MUST match the string in your @Query() decorator
    getTsutsykHistory(sessionId: ID!): [Location!]!

    # Optional: add a query to get the tracker details
    getTsutsyk(id: ID!): Tsutsyk
}

type Mutation {
    # While trackers use REST, you can use this for manual testing
    # or if the client needs to manually add a point.
    postLocation(
        tsutsykId: String!,
        sessionId: String!,
        lat: Float!,
        lng: Float!
    ): Location!
}

type Subscription {
    # The magic part: The client listens here for real-time updates
    # Filtered by sessionId so you don't receive everyone's coordinates
    locationUpdates(sessionId: ID!): Location!
}